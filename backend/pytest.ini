[pytest]
pythonpath = .
markers =
    real_embedding_model: opts out of the autouse fake embedding model fixture and loads the real all-MiniLM-L6-v2 model (requires internet on first run to download it; slow).
    real_reranker_model: opts out of the autouse fake cross-encoder fixture and loads the real cross-encoder/ms-marco-MiniLM-L-6-v2 model (requires internet on first run to download it; slow).
    real_ollama_model: runs against a real local Ollama server with the configured model pulled; skipped in the normal offline suite. Run with: pytest -m real_ollama_model.
